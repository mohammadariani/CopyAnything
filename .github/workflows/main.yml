name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          F=$(find . -name settings.gradle.kts | head -1)
          echo "Found: $F"
          echo "DIR=$(dirname "$F")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug -p "$DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: CopyAnything-debug-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
